spring.application.name=frota-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/frota}
spring.datasource.username=${DB_USER:frota}
spring.datasource.password=${DB_PASSWORD:frota_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.error.include-message=never
app.seed.enabled=${FROTA_SEED_ENABLED:true}
app.auth.master-email=${MASTER_EMAIL:admin@frotaflow.local}
app.auth.master-password=${MASTER_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
