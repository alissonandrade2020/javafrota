name: frota-homolog
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-frota_homolog}
      POSTGRES_USER: ${DB_USER:-frota}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente de homologacao}
    volumes: [homolog_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    image: ${BACKEND_IMAGE:?Defina BACKEND_IMAGE}
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-frota_homolog}
      DB_USER: ${DB_USER:-frota}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  frontend:
    image: ${FRONTEND_IMAGE:?Defina FRONTEND_IMAGE}
    ports: ["${APP_PORT:-8081}:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  homolog_data:
