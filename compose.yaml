name: frota-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-frota}
      POSTGRES_USER: ${DB_USER:-frota}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-frota_dev_change_me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-frota}
      DB_USER: ${DB_USER:-frota}
      DB_PASSWORD: ${DB_PASSWORD:-frota_dev_change_me}
      FROTA_SEED_ENABLED: ${FROTA_SEED_ENABLED:-true}
      MASTER_EMAIL: ${MASTER_EMAIL:-admin@frotaflow.local}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-FrotaFlow@2026!}
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["${APP_PORT:-4200}:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  postgres_data:
