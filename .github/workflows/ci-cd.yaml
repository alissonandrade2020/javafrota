name: CI, homologacao e producao
on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag do commit ja validado em homologacao (ex.: abc1234)"
        required: true
        type: string
      deploy_production:
        description: "Publicar essa mesma imagem em producao"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: frota-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Testar backend
        working-directory: backend
        run: mvn -B test
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Instalar e compilar frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build
  build-and-publish:
    name: Construir e publicar imagens imutáveis
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: owner
        shell: bash
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/frota-api:${{ steps.meta.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/frota-web:${{ steps.meta.outputs.tag }}
  deploy-homolog:
    name: Deploy homologacao
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: homologacao
    steps:
      - name: Validar secrets de homologacao
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PASSWORD: ${{ secrets.DB_PASSWORD }}
          MASTER_EMAIL: ${{ secrets.MASTER_EMAIL }}
          MASTER_PASSWORD: ${{ secrets.MASTER_PASSWORD }}
        run: test -n "$HOST" && test -n "$USER" && test -n "$KEY" && test -n "$PASSWORD" && test -n "$MASTER_EMAIL" && test -n "$MASTER_PASSWORD"
      - name: Deploy remoto com SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build-and-publish.outputs.tag }}
          IMAGE_OWNER: ${{ needs.build-and-publish.outputs.owner }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MASTER_EMAIL: ${{ secrets.MASTER_EMAIL }}
          MASTER_PASSWORD: ${{ secrets.MASTER_PASSWORD }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_OWNER,DB_PASSWORD,MASTER_EMAIL,MASTER_PASSWORD,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd /opt/frota/homolog
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export BACKEND_IMAGE="ghcr.io/$IMAGE_OWNER/frota-api:$IMAGE_TAG"
            export FRONTEND_IMAGE="ghcr.io/$IMAGE_OWNER/frota-web:$IMAGE_TAG"
            export DB_PASSWORD
            export MASTER_EMAIL MASTER_PASSWORD
            docker compose -f compose.homolog.yaml pull
            docker compose -f compose.homolog.yaml up -d --remove-orphans
            for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8081/api/health >/dev/null; then exit 0; fi; sleep 5; done
            docker compose -f compose.homolog.yaml logs --tail=100
            exit 1
  deploy-production:
    name: Deploy producao (aprovacao obrigatoria)
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
    needs: test
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Validar tag informada
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$TAG" =~ ^[a-f0-9]{7,40}$ ]] || { echo 'Informe uma tag SHA valida.'; exit 1; }
      - name: Deploy da mesma imagem validada
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MASTER_EMAIL: ${{ secrets.MASTER_EMAIL }}
          MASTER_PASSWORD: ${{ secrets.MASTER_PASSWORD }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_OWNER,DB_PASSWORD,MASTER_EMAIL,MASTER_PASSWORD,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd /opt/frota/producao
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE_OWNER=$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
            export BACKEND_IMAGE="ghcr.io/$IMAGE_OWNER/frota-api:$IMAGE_TAG"
            export FRONTEND_IMAGE="ghcr.io/$IMAGE_OWNER/frota-web:$IMAGE_TAG"
            export DB_PASSWORD
            export MASTER_EMAIL MASTER_PASSWORD
            docker compose -f compose.producao.yaml pull
            docker compose -f compose.producao.yaml up -d --remove-orphans
            for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then exit 0; fi; sleep 5; done
            docker compose -f compose.producao.yaml logs --tail=100
            exit 1
